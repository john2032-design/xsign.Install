
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Preparing Install</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
      color: #171717;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 24px;
      border: 3px solid #ededed;
      border-top-color: #171717;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
    }

    p {
      color: #737373;
      font-size: 15px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      color: #111;
      font-size: 15px;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .error {
      color: #c62828;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .icon { animation: none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="icon" id="spinner"></div>

    <h1 id="heading">Preparing install...</h1>

    <p id="message">
      Please wait while we open the installation link.
    </p>

    <a id="fallback" href="#" hidden>
      Click here if nothing happens
    </a>

    <p id="error" class="error" hidden></p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const otaUrl = params.get("ota");

    const fallback = document.getElementById("fallback");
    const message = document.getElementById("message");
    const error = document.getElementById("error");
    const spinner = document.getElementById("spinner");

    if (!otaUrl || !/^itms-services:\/\//i.test(otaUrl)) {
      spinner.hidden = true;
      message.hidden = true;
      error.hidden = false;
      error.textContent = "Invalid or missing installation link.";
    } else {
      // Provide a direct fallback for browsers that block automatic opening.
      fallback.href = otaUrl;
      fallback.hidden = false;

      // Attempt to open the iOS OTA installation URL.
      // The fallback remains available if the browser blocks this.
      window.location.href = otaUrl;
    }
  </script>
</body>
</html>
