<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Install App</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b0b0f;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #15151b;
      border: 1px solid #292933;
      border-radius: 22px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 70px #0008;
    }
    .logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      margin: 0 auto 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }
    .sub {
      color: #a7a7b2;
      line-height: 1.55;
      margin: 0 0 22px;
    }
    .error {
      color: #ff7373;
      margin-top: 15px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      background: #fff;
      color: #111;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      opacity: 0.9;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">OTA</div>
    <h1>Install App</h1>
    <p id="status" class="sub">
      Preparing your installation link...
    </p>
    <button id="install" class="hidden">
      Install App
    </button>
    <p id="error" class="error"></p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const ota = params.get("ota");
    const status = document.getElementById("status");
    const button = document.getElementById("install");
    const error = document.getElementById("error");
    if (!ota || !/^itms-services:\/\//i.test(ota)) {
      status.textContent = "";
      error.textContent =
        "This installation link is invalid or incomplete.";
    } else {
      status.textContent =
        "Tap below to start installing the app on your iPhone or iPad.";
      button.classList.remove("hidden");
      button.addEventListener("click", () => {
        window.location.href = ota;
      });
    }
  </script>
</body>
</html>
